name: Tagged source release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        flags: [default, external-cflags]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install build prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential zlib1g-dev python3
      - name: Default build
        if: matrix.flags == 'default'
        run: make -j2
      - name: Build with caller CFLAGS
        if: matrix.flags == 'external-cflags'
        run: make -j2 CFLAGS='-O2 -std=gnu11'
      - name: Smoke, CLI, docs, tutorial, and release checks
        env:
          BUILD_VARIANT: ${{ matrix.flags }}
        run: |
          if [ "$BUILD_VARIANT" = external-cflags ]; then
            make test CFLAGS='-O2 -std=gnu11'
          else
            make test
          fi
  publish:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install build prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential zlib1g-dev python3
      - name: Build and package the tagged source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          make -j2
          python3 build/release_assets.py --tag "$RELEASE_TAG" --output "$RUNNER_TEMP/release-assets"
      - name: Preserve verified artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: ${{ runner.temp }}/release-assets/
      - name: Publish without replacing an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to replace its assets.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" --verify-tag --title "KSSD3A $RELEASE_TAG" \
            --notes-file CHANGELOG.md "$RUNNER_TEMP/release-assets/"*
